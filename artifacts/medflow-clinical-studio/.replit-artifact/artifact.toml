kind = "web"
previewPath = "/"
title = "MedFlow Clinical Studio"
description = "Existing FastAPI clinical studio and receptionist interface, served directly from the project root."
version = "1.0.0"
id = "artifacts/medflow-clinical-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8000

[services.development]
run = "cd ../.. && python scripts/run_demo.py"

[services.production]
build = [ "python", "-m", "pip", "install", "-r", "requirements-deploy.txt" ]

[services.production.run]
args = ["python", "scripts/run_demo.py", "--published"]

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "8000"
BASE_PATH = "/"
