kind = "web"
previewPath = "/"
title = "MedFlow Clinical Studio"
description = "Existing FastAPI clinical studio and receptionist interface, served directly from the project root."
version = "1.0.0"
id = "artifacts/medflow-clinical-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8000

[services.development]
run = "cd ../.. && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medflow-clinical-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/medflow-clinical-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8000"
BASE_PATH = "/"
