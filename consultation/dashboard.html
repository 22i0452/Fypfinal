<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medflow AI Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#ECEDEF;--nav:#081D3A;--white:#fff;--line:#DEE3EA;--text:#1F2937;--muted:#6B7280}
    body{font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .app{display:flex;min-height:100vh}
    .nav{width:280px;background:var(--nav);padding:14px 16px;display:flex;flex-direction:column;color:#ECF2FA}
    .brand{display:flex;align-items:center;margin-bottom:16px;padding:4px 2px}
    .brand-logo{width:250px;max-width:100%;height:auto;display:block;color:#FFFFFF}
    .menu{display:flex;flex-direction:column;gap:6px}
    .item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid transparent;background:transparent;color:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
    .item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
    .item.active{background:#fff;color:#0A2240}
    .spacer{flex:1}
    .feedback{border:1px solid var(--line);background:#fff;color:#0A2240;padding:11px;font-size:16px;cursor:pointer}

    .main{flex:1;display:flex;flex-direction:column}
    .top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
    .greet{font-size:18px}
    .greet b{font-weight:700}
    .right{display:flex;align-items:center;gap:14px}
    .badge{background:#fff;border:1px solid var(--line);padding:6px 12px;color:#11803D}
    .avatar{width:44px;height:44px;border-radius:50%;background:#1E88B5;color:#fff;display:grid;place-items:center;font-weight:700}

    .content{padding:38px 28px}
    .hero{text-align:center;margin-bottom:20px}
    .hero h1{font-size:64px;font-weight:500;margin-bottom:10px}
    .hero p{font-size:17px;color:#374151;line-height:1.3}

    .panel{width:min(980px,90%);margin:0 auto;background:#F8FAFC;border:1px solid var(--line);border-radius:22px;overflow:hidden}
    .search{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
    .search input{flex:1;border:0;background:transparent;font-size:16px;outline:none;color:#111827}
    .add{border:0;background:#0A2240;color:#fff;font-size:16px;padding:10px 22px;cursor:pointer}
    .list{max-height:380px;overflow:auto}
    .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #EEF2F7;cursor:pointer;background:#fff}
    .row:hover{background:#F5F8FD}
    .tag{width:40px;height:40px;border-radius:10px;background:#E8EDF4;color:#5A708D;display:grid;place-items:center;font-weight:700;font-size:20px}
    .name{font-size:16px;font-weight:500}
    .meta{font-size:12px;color:#6B7280}

    .logout{background:#fff;border:1px solid var(--line);padding:8px 12px;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div class="app">
    <aside class="nav">
      <div class="brand" aria-label="MedFlowAI">
        <svg class="brand-logo" viewBox="0 0 470 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedFlowAI logo">
          <g transform="translate(4,6)" stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M58 8v67"/>
            <circle cx="58" cy="10" r="5" fill="currentColor"/>
            <path d="M33 18c10 8 18 11 25 11s15-3 25-11"/>
            <path d="M33 18c-6 8-11 12-17 13"/>
            <path d="M83 18c6 8 11 12 17 13"/>
            <path d="M58 20c-11 7-18 15-18 24 0 7 4 12 18 17 14 5 18 10 18 17 0 9-8 17-18 24"/>
            <path d="M58 20c11 7 18 15 18 24 0 7-4 12-18 17-14 5-18 10-18 17 0 9 8 17 18 24"/>
            <path d="M12 32h15"/>
            <path d="M8 47h19"/>
            <path d="M12 62h15"/>
            <circle cx="8" cy="32" r="3" fill="currentColor"/>
            <circle cx="4" cy="47" r="3" fill="currentColor"/>
            <circle cx="8" cy="62" r="3" fill="currentColor"/>
            <path d="M89 32h9"/>
            <path d="M89 47h13"/>
            <path d="M89 62h9"/>
          </g>
          <text x="118" y="61" fill="currentColor" font-family="Segoe UI, Tahoma, sans-serif" font-size="52" font-weight="700">MedFlowAI</text>
        </svg>
      </div>
      <div class="menu">
        <button class="item active"><svg viewBox="0 0 24 24"><path d="M7 3v4M17 3v4M4 11h16M6 7h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/></svg>Visits</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M15 3v5h5"/></svg>Notes</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Notes Templates</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M9 12h6M12 9v6"/><rect x="4" y="5" width="16" height="14" rx="2"/></svg>Assistant</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 4h4v3h-2l-1 11H7L6 10H4V7h4l1-4Z"/></svg>Labs</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg>Medical Coder</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="m12 2 2.3 4.7L19 9l-4.7 2.3L12 16l-2.3-4.7L5 9l4.7-2.3Z"/></svg>Automations</button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6v4l2 3H4l2-3V9a6 6 0 0 1 6-6Z"/><path d="M10 20h4"/></svg>Alerts</button>
      </div>
      <div class="spacer"></div>
      <button class="feedback">Send Feedback</button>
    </aside>

    <section class="main">
      <div class="top">
        <div class="greet">Good Morning Doctor <b id="doctorName">Doctor</b></div>
        <div class="right">
          <div class="badge">Available 24/7</div>
          <button class="logout" id="logoutBtn">Logout</button>
          <div class="avatar" id="doctorInitials">DR</div>
        </div>
      </div>

      <div class="content">
        <div class="hero">
          <h1>Welcome back</h1>
          <p>You are now connected to Medflow AI for healthcare operations.</p>
        </div>

        <div class="panel">
          <div class="search">
            <span style="font-size:26px">⌕</span>
            <input id="searchInput" placeholder="Add or select patient...">
            <button class="add" id="addSampleBtn">+ Add</button>
          </div>
          <div class="list" id="patientList"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const listEl = document.getElementById('patientList');
    const searchInput = document.getElementById('searchInput');
    const doctorName = document.getElementById('doctorName');
    const doctorInitials = document.getElementById('doctorInitials');

    let allPatients = [];

    function initials(name){
      const p = (name||'Doctor').trim().split(/\s+/).filter(Boolean);
      return (p[0]?.[0] || 'D') + (p[1]?.[0] || 'R');
    }

    async function loadDoctor(){
      const r = await fetch('/api/consultation/me');
      if(!r.ok){
        window.location.href = '/consultation/login';
        return;
      }
      const d = await r.json();
      doctorName.textContent = d.full_name;
      doctorInitials.textContent = initials(d.full_name).toUpperCase();
    }

    function renderPatients(rows){
      listEl.innerHTML = '';
      if(!rows.length){
        listEl.innerHTML = '<div class="row"><div class="meta">No patients found</div></div>';
        return;
      }
      rows.forEach(p => {
        const el = document.createElement('div');
        el.className = 'row';
        el.innerHTML = `
          <div class="tag">${(p.name || 'NA').slice(0,2).toUpperCase()}</div>
          <div>
            <div class="name">${p.name || 'Unknown Patient'}</div>
            <div class="meta">${p.file_name}${p.booking_slot_time ? ' • Slot ' + p.booking_slot_time : ''}</div>
          </div>
        `;
        el.addEventListener('click', () => {
          window.location.href = '/consultation/patient/' + encodeURIComponent(p.file_name);
        });
        listEl.appendChild(el);
      });
    }

    async function loadPatients(){
      const r = await fetch('/api/consultation/patients');
      if(!r.ok){
        listEl.innerHTML = '<div class="row"><div class="meta">Could not load patients</div></div>';
        return;
      }
      allPatients = await r.json();
      renderPatients(allPatients);
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if(!q){ renderPatients(allPatients); return; }
      renderPatients(allPatients.filter(p => (p.name || '').toLowerCase().includes(q) || p.file_name.toLowerCase().includes(q)));
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/consultation/logout', {method:'POST'});
      window.location.href = '/consultation/login';
    });

    document.getElementById('addSampleBtn').addEventListener('click', async () => {
      await fetch('/api/consultation/patients/seed', {method:'POST'});
      await loadPatients();
    });

    (async function init(){
      await loadDoctor();
      await loadPatients();
    })();
  </script>
</body>
</html>
